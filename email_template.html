<!doctype html>
<html><body style="margin:0;background:#f4f6f8;font-family:Segoe UI,Arial,sans-serif;color:#14202b">
<div style="max-width:560px;margin:24px auto;background:#fff;border:1px solid #dde3e8;border-radius:8px;overflow:hidden">
<div style="padding:14px 24px;background:#0f6cbd;color:#fff;font-size:13px">{{subject}}</div>
<div style="padding:24px">
<h2 style="margin:0 0 12px;font-size:20px">{{title}}</h2>
<p style="margin:0 0 20px;line-height:1.55;white-space:pre-wrap">{{message}}</p>
<p style="margin:0;font-size:12px;color:#5b6b78">Sent {{timestamp}} from {{source}}</p>
</div></div></body></html>
