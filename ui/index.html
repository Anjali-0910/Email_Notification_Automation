<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notification console</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#14202b;--quiet:#5b6b78;--line:#dde3e8;--accent:#0f6cbd;--bad:#b3261e;--warn:#8a5a00}
@media (prefers-color-scheme:dark){:root{--bg:#10171d;--card:#18222b;--ink:#e8eef3;--quiet:#98a8b5;--line:#2a3944;--accent:#59a6ee;--bad:#ff8a80;--warn:#f0b44c}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,sans-serif}
header{padding:20px 24px 0;max-width:1080px;margin:0 auto}h1{margin:0;font-size:22px}header p{margin:4px 0 0;color:var(--quiet)}
main{max-width:1080px;margin:16px auto;padding:0 24px 40px;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:16px}
@media (max-width:820px){main{grid-template-columns:1fr}}
section{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px}
h2{margin:0 0 12px;font-size:15px}label{display:block;font-size:13px;color:var(--quiet);margin:10px 0 4px}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:84px;resize:vertical}:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button{font:inherit;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 12px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;margin-top:14px;width:100%;padding:9px}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px}
.tabs{display:flex;gap:4px;margin-bottom:10px}.tabs button[aria-selected=true]{border-color:var(--accent);color:var(--accent)}
iframe{width:100%;height:330px;border:1px solid var(--line);border-radius:6px;background:#fff}
pre{margin:0;padding:12px;height:330px;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:6px;font:12.5px/1.5 ui-monospace,Consolas,monospace}
.meta{font-size:13px;color:var(--quiet);margin:0 0 8px}.note{color:var(--warn)}.err{color:var(--bad)}
#log{grid-column:1/-1}#log ul{list-style:none;margin:0;padding:0}#log li{display:flex;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
#log li:first-child{border-top:0}.t{color:var(--quiet);min-width:72px}.empty{color:var(--quiet)}
</style></head><body>
<header><h1>Notification console</h1><p>Send a test event, check the email it builds, and watch the log.</p></header>
<main>
<section aria-labelledby="h-event"><h2 id="h-event">Event</h2>
<div class="presets" role="group" aria-label="Sample events">
<button type="button" data-p="normal">Normal</button><button type="button" data-p="priority">Priority alert</button>
<button type="button" data-p="bad">Bad event</button><button type="button" data-p="daily">Daily report</button></div>
<form id="f">
<label for="to">Recipient</label><input id="to" type="email" placeholder="user@example.com">
<label for="subject">Subject</label><input id="subject" value="Test notification">
<label for="title">Title</label><input id="title" value="System alert">
<label for="message">Message</label><textarea id="message">This is a test notification.</textarea>
<label for="priority">Priority</label><select id="priority"><option value="normal">Normal</option><option value="high">High</option><option value="critical">Critical</option></select>
<button class="primary" type="submit">Send event</button></form></section>
<section aria-labelledby="h-out"><h2 id="h-out">Result</h2>
<div class="tabs" role="tablist"><button role="tab" id="tab-mail" aria-selected="true">Email preview</button><button role="tab" id="tab-json" aria-selected="false">Event JSON</button></div>
<p class="meta" id="meta">Nothing sent yet. Fill the form or pick a sample event.</p>
<iframe id="preview" sandbox title="Email preview"></iframe><pre id="json" hidden></pre></section>
<section id="log" aria-labelledby="h-log"><h2 id="h-log">Sent log</h2><ul id="list"><li class="empty">No events yet.</li></ul></section>
</main>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// Browser copy of the template, used only when server.py is not running.
const TPL='<body style="margin:0;background:#f4f6f8;font-family:Segoe UI,Arial,sans-serif;color:#14202b"><div style="max-width:560px;margin:24px auto;background:#fff;border:1px solid #dde3e8;border-radius:8px;overflow:hidden"><div style="padding:14px 24px;background:#0f6cbd;color:#fff;font-size:13px">{{subject}}</div><div style="padding:24px"><h2 style="margin:0 0 12px;font-size:20px">{{title}}</h2><p style="margin:0 0 20px;line-height:1.55;white-space:pre-wrap">{{message}}</p><p style="margin:0;font-size:12px;color:#5b6b78">Sent {{timestamp}} from {{source}}</p></div></div></body>';
function mockBuild(ev){
  if(typeof ev!=='object'||ev===null) throw new Error('Event must be a JSON object');
  const c=ev.emailConfig||{};let subject=c.subject||'Notification';
  if(['high','critical'].includes(ev.priority)) subject='[URGENT] '+subject;
  const v={subject,title:ev.title||'Notification',message:ev.message||'',timestamp:new Date().toISOString().slice(0,16).replace('T',' ')+' UTC',source:ev.source||'custom.application'};
  let html=TPL;for(const k in v) html=html.replace('{{'+k+'}}',esc(v[k]));
  return {to:c.recipient||'placeholder@example.com',subject,html,usedDefaultRecipient:!c.recipient};
}
async function build(ev){
  try{const r=await fetch('/api/events',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(ev)});
    const d=await r.json();if(!r.ok) throw new Error(d.error||'Server error');return {mail:d,mode:'server'};}
  catch(e){if(e instanceof TypeError){return {mail:mockBuild(ev),mode:'browser'};}throw e;}
}
function formEvent(){
  const ev={emailConfig:{subject:$('subject').value.trim()},title:$('title').value.trim(),message:$('message').value.trim(),priority:$('priority').value,source:'custom.application'};
  if($('to').value.trim()) ev.emailConfig.recipient=$('to').value.trim();return ev;
}
const PRESETS={
  normal:{emailConfig:{recipient:'user@example.com',subject:'Order confirmed'},title:'Your order is confirmed',message:'Order #1042 will arrive on Friday.',priority:'normal'},
  priority:{emailConfig:{recipient:'oncall@example.com',subject:'Payment service down'},title:'Payments are failing',message:'The payment service has returned errors for 5 minutes.',priority:'critical'}};
function fill(ev){$('to').value=ev.emailConfig.recipient||'';$('subject').value=ev.emailConfig.subject;$('title').value=ev.title;$('message').value=ev.message;$('priority').value=ev.priority;}
function show(tab){const m=tab==='mail';$('preview').hidden=!m;$('json').hidden=m;$('tab-mail').setAttribute('aria-selected',m);$('tab-json').setAttribute('aria-selected',!m);}
$('tab-mail').onclick=()=>show('mail');$('tab-json').onclick=()=>show('json');
function logLine(text,cls){const l=$('list');if(l.querySelector('.empty')) l.innerHTML='';
  const li=document.createElement('li');li.innerHTML='<span class="t">'+new Date().toLocaleTimeString()+'</span><span class="'+(cls||'')+'"></span>';
  li.lastChild.textContent=text;l.prepend(li);}
async function send(ev){
  $('json').textContent=JSON.stringify(ev,null,2);
  try{const {mail,mode}=await build(ev);
    $('preview').srcdoc=mail.html;
    $('meta').className='meta';$('meta').textContent='To '+mail.to+' | '+mail.subject+' | built in '+mode;
    if(mail.usedDefaultRecipient){$('meta').textContent+=' | no recipient given, default used';$('meta').classList.add('note');}
    logLine('Built email "'+mail.subject+'" for '+mail.to+(mail.usedDefaultRecipient?' (default recipient)':''),mail.usedDefaultRecipient?'note':'');
  }catch(e){$('meta').className='meta err';$('meta').textContent='Could not build the email: '+e.message;$('preview').srcdoc='';logLine('ERROR '+e.message,'err');}
}
$('f').onsubmit=e=>{e.preventDefault();send(formEvent());};
document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{
  const p=b.dataset.p;
  if(PRESETS[p]){fill(PRESETS[p]);send(PRESETS[p]);}
  else if(p==='bad') send({invalidField:'test'});
  else send({title:'Daily report',message:'42 orders, 3 failed payments, 0 incidents.'});
});
</script></body></html>
